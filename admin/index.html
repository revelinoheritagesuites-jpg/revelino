<!doctype html>
<html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Administracija · Revelino</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#f4efe6;color:#2b2620}
.top{position:sticky;top:0;z-index:5;background:#2b2620;color:#fff;display:flex;gap:12px;align-items:center;padding:12px 20px;flex-wrap:wrap}
.top b{flex:1;font-size:18px}button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 18px}
.save{background:#a8864f;color:#fff;font-weight:600;font-size:17px;padding:12px 28px}.save.dirty{background:#c0392b}
.ghost{background:#fff3;color:#fff}.tabs{display:flex;gap:6px;padding:16px 20px 0;flex-wrap:wrap}
.tabs button{background:#e4dac6}.tabs button.on{background:#fff;font-weight:600}
main{max-width:860px;margin:0 auto;padding:20px}.panel{background:#fff;border-radius:12px;padding:24px;margin-bottom:20px}
label{display:block;font-weight:600;margin:18px 0 6px}small{color:#7a6e5c;font-weight:400}
input[type=text],textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid #cfc3ac;border-radius:8px}textarea{min-height:110px}
.item{border:1px solid #e4dac6;border-radius:10px;padding:6px 18px 18px;margin:16px 0;background:#fcfaf5}
.item h4{margin:14px 0 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.thumb{width:110px;height:80px;object-fit:cover;border-radius:6px;background:#e4dac6}.imgs{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0}
.imgs figure{margin:0;text-align:center}.sm{padding:6px 12px;background:#eee;font-size:14px}.del{background:#f6d6d2;color:#8c2a20}.add{background:#e4dac6}
#login{max-width:360px;margin:12vh auto;background:#fff;padding:30px;border-radius:12px}#login button{width:100%;margin-top:20px;background:#a8864f;color:#fff}
.err{color:#c0392b;margin-top:12px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2b2620;color:#fff;padding:14px 26px;border-radius:10px;display:none;z-index:9}
</style></head><body>
<div id="login" style="display:none"><h2>Revelino · Prijava</h2>
<label>Korisničko ime</label><input type="text" id="u" autocomplete="username">
<label>Lozinka</label><input type="password" id="p" autocomplete="current-password" style="width:100%;padding:10px;font:inherit;border:1px solid #cfc3ac;border-radius:8px">
<button id="go">Prijavi se</button><div class="err" id="err"></div></div>
<div id="app" style="display:none">
<div class="top"><b>Revelino · Uređivanje stranice</b><a href="/" target="_blank" style="color:#fff">Pogledaj stranicu ↗</a><button class="ghost" id="out">Odjava</button><button class="save" id="save">Spremi promjene</button></div>
<div class="tabs" id="tabs"></div><main id="main"></main></div><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);let D,tab=0,dirty=false;
const T='text',A='area',I='img';
const SEC=[
{l:'Početna stranica',f:[['hero.title','Veliki naslov',T],['hero.subtitle','Podnaslov',A],['hero.image','Naslovna fotografija (velika, preko cijelog ekrana)',I],['hero.cta','Tekst gumba za rezervaciju',T],['intro.title','Naslov uvoda',T],['intro.text','Tekst uvoda',A],['intro.image','Fotografija uz uvod',I],['highlights','Istaknute prednosti (tri kratka stupca)','list',{n:'Prednost',t:'title',f:[['title','Naslov',T],['text','Kratki opis',A]]}]]},
{l:'Apartmani',f:[['apartmentsTitle','Naslov odjeljka',T],['apartments','Apartmani','list',{n:'Apartman',t:'name',fixed:1,f:[['name','Naziv',T],['short','Kratki opis (na kartici)',A],['description','Cijeli opis',A],['price','Cijena (npr. od 120 €)',T],['priceNote','Napomena uz cijenu (npr. po noćenju)',T],['guests','Broj gostiju',T],['size','Površina',T],['image','Glavna fotografija',I],['images','Fotografije apartmana','imgs']]}]]},
{l:'Galerija',f:[['galleryTitle','Naslov galerije',T],['gallery','Fotografije u galeriji','gal']]},
{l:'Kontakt',f:[['contact.title','Naslov',T],['contact.text','Uvodni tekst',A],['contact.address','Adresa',T],['contact.phone','Telefon',T],['contact.email','E-mail',T],['contact.whatsapp','WhatsApp broj (npr. +385911234567)',T],['contact.instagram','Instagram (npr. @revelino)',T],['footer','Tekst u podnožju',T],['site.name','Naziv objekta (gore lijevo)',T]]}
];
const get=(o,p)=>p.split('.').reduce((a,k)=>a?.[k],o),set=(o,p,v)=>{const k=p.split('.');const l=k.pop();k.reduce((a,x)=>a[x]??={},o)[l]=v;mark()};
const mark=()=>{dirty=true;$('save').classList.add('dirty');$('save').textContent='Spremi promjene •'};
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3500)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function shrink(file){const b=await createImageBitmap(file);const s=Math.min(1,1800/Math.max(b.width,b.height));const c=document.createElement('canvas');c.width=b.width*s;c.height=b.height*s;c.getContext('2d').drawImage(b,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.85))}
async function upload(file){const r=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':'image/jpeg'},body:await shrink(file)});if(!r.ok)throw 0;return (await r.json()).url}
function pick(multi,cb){const i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=multi;i.onchange=async()=>{toast('Učitavam fotografije…');try{for(const f of i.files)await cb(await upload(f));toast('Fotografije učitane. Ne zaboravite kliknuti „Spremi promjene“.')}catch{toast('Greška pri učitavanju fotografije.')}render()};i.click()}
function field(obj,[p,label,type,opt],pre=''){
 const v=get(obj,p);
 if(type===T)return`<label>${label}</label><input type="text" value="${esc(v)}" data-p="${p}">`;
 if(type===A)return`<label>${label}</label><textarea data-p="${p}">${esc(v)}</textarea>`;
 if(type===I)return`<label>${label}</label><div class="row">${v?`<img class="thumb" src="${esc(v)}">`:'<span><small>nema fotografije</small></span>'}<button class="sm" data-act="pick">${v?'Zamijeni':'Dodaj'} fotografiju</button>${v?'<button class="sm del" data-act="clr">Ukloni</button>':''}</div>`.replace('data-act="pick"',`data-act="pick" data-p="${p}"`).replace('data-act="clr"',`data-act="clr" data-p="${p}"`);
 if(type==='imgs')return`<label>${label}</label><div class="imgs">${(v||[]).map((s,i)=>`<figure><img class="thumb" src="${esc(s)}"><br><button class="sm del" data-act="rmimg" data-p="${p}" data-i="${i}">Obriši</button></figure>`).join('')}</div><button class="sm add" data-act="addimgs" data-p="${p}">+ Dodaj fotografije</button>`;
 if(type==='gal')return`<div class="imgs">${(v||[]).map((g,i)=>`<figure><img class="thumb" src="${esc(g.src)}"><br><input type="text" placeholder="opis (neobavezno)" style="width:110px;font-size:12px" value="${esc(g.alt)}" data-gi="${i}"><br><button class="sm del" data-act="rmgal" data-i="${i}">Obriši</button></figure>`).join('')||'<small>Galerija je prazna.</small>'}</div><button class="sm add" data-act="addgal">+ Dodaj fotografije u galeriju</button>`;
 if(type==='list')return`<label>${label}</label>${(v||[]).map((it,i)=>`<div class="item"><h4>${opt.n} ${i+1}${it[opt.t]?': '+esc(it[opt.t]):''}</h4>${opt.f.map(f=>field(it,f).replace(/data-p="([^"]+)"/g,`data-p="$1" data-list="${p}" data-i="${i}"`)).join('')}${opt.fixed?'':`<p><button class="sm del" data-act="rmitem" data-p="${p}" data-i="${i}">Obriši ovu stavku</button></p>`}</div>`).join('')}${opt.fixed?'':`<button class="sm add" data-act="additem" data-p="${p}">+ Dodaj</button>`}`;
}
function render(){
 $('tabs').innerHTML=SEC.map((s,i)=>`<button class="${i==tab?'on':''}" data-tab="${i}">${s.l}</button>`).join('');
 $('main').innerHTML=`<div class="panel">${SEC[tab].f.map(f=>field(D,f).replace(/(<\/?[^>]*>)/,'$1')).join('')}</div>`;
}
const target=el=>el.dataset.list?D[el.dataset.list][+el.dataset.i]:D;
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.gi!==undefined){D.gallery[el.dataset.gi].alt=el.value;mark()}else if(el.dataset.p)set(target(el),el.dataset.p,el.value)});
document.addEventListener('click',async e=>{const el=e.target.closest('button');if(!el)return;
 if(el.dataset.tab!==undefined){tab=+el.dataset.tab;render();return}
 const a=el.dataset.act,p=el.dataset.p,i=+el.dataset.i,o=target(el);
 if(a==='pick')pick(false,u=>set(o,p,u));
 if(a==='clr'){set(o,p,'');render()}
 if(a==='addimgs')pick(true,u=>{(o[p]??=[]).push(u);mark()});
 if(a==='rmimg'){o[p].splice(i,1);mark();render()}
 if(a==='addgal')pick(true,u=>{D.gallery.push({src:u,alt:''});mark()});
 if(a==='rmgal'){if(confirm('Obrisati ovu fotografiju?')){D.gallery.splice(i,1);mark();render()}}
 if(a==='rmitem'){if(confirm('Obrisati ovu stavku?')){D[p].splice(i,1);mark();render()}}
 if(a==='additem'){D[p].push({title:'',text:''});mark();render()}
});
$('save').onclick=async()=>{const r=await fetch('/api/content',{method:'PUT',body:JSON.stringify(D)});if(r.ok){dirty=false;$('save').classList.remove('dirty');$('save').textContent='Spremi promjene';toast('Spremljeno! Promjene su odmah vidljive na stranici.')}else toast('Spremanje nije uspjelo. Prijavite se ponovno.')};
$('out').onclick=async()=>{await fetch('/api/login',{method:'DELETE'});location.reload()};
addEventListener('beforeunload',e=>{if(dirty)e.preventDefault()});
async function start(){
 const r=await fetch('/api/content');D=await r.json();
 const t=await fetch('/api/login');
 if(!t.ok){$('login').style.display='block';return}
 $('login').style.display='none';$('app').style.display='block';render()}
$('go').onclick=async()=>{const r=await fetch('/api/login',{method:'POST',body:JSON.stringify({user:$('u').value,pass:$('p').value})});if(r.ok)start();else $('err').textContent=(await r.json()).error};
$('p').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
start();
</script></body></html>
